name: Build and attest release installers

on:
  workflow_call:
    outputs:
      version_name:
        value: ${{ jobs.build.outputs.version_name }}
    secrets:
      RELEASE_SIGNING_PRIVATE_KEY:
        required: true
      APPLE_CERTIFICATE:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_PASSWORD:
        required: true
      APPLE_SIGNING_IDENTITY:
        required: true
      APPLE_TEAM_ID:
        required: true

jobs:
  build:
    name: Build desktop app (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plain-desktop
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-24.04
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plain-desktop

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: ./plain-desktop/.github/actions/locked-core-assets

      - name: Set version name
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT

      - name: Enable Corepack
        shell: bash
        run: corepack enable

      - name: Install frontend dependencies
        shell: bash
        run: yarn install --immutable

      - name: Typecheck frontend
        shell: bash
        run: yarn typecheck

      - name: Setup Rust
        run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0

      - name: Select Xcode with macOS 15 SDK
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          for xc in /Applications/Xcode*.app; do
            sdk="$(DEVELOPER_DIR="$xc" xcrun --sdk macosx --show-sdk-version)"
            if [[ "$sdk" == 15.* ]]; then
              sudo xcode-select -s "$xc"
              break
            fi
          done
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          if [[ "$sdk" != 15.* ]]; then
            echo "::error::No Xcode with macOS 15 SDK found (active SDK: $sdk). Binaries signed with Runtime Version > 15 are killed at launch on macOS 15."
            exit 1
          fi
          xcodebuild -version
          echo "Active macOS SDK: $sdk"

      - name: Add macOS Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev gcc-14 g++-14 rpm2cpio cpio
          gcc-14 --version
          g++-14 --version
          echo 'CC=gcc-14' >> "$GITHUB_ENV"
          echo 'CXX=g++-14' >> "$GITHUB_ENV"

      - name: Validate macOS signing secrets
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import macOS signing certificate
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/build_certificate.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning

      - name: Build desktop app
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash build-desktop.sh

      - name: Notarize and staple macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
                 target/x86_64-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No macOS DMG artifacts found"
            exit 1
          fi
          for file in "${files[@]}"; do
            xcrun codesign --force --sign "$APPLE_SIGNING_IDENTITY" "$file"
            xcrun notarytool submit "$file" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$file"
          done

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version_name }}"
          mkdir -p release-artifacts
          shopt -s nullglob

          case "${{ matrix.platform }}" in
            macos)
              files=(target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
                     target/x86_64-apple-darwin/release/bundle/dmg/*.dmg)
              ;;
            windows)
              files=(target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe)
              ;;
            linux)
              files=(target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage)
              ;;
          esac

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No bundle artifacts found for ${{ matrix.platform }}" >&2
            if [ "${{ matrix.platform }}" = "macos" ]; then
              find target -path '*/bundle/dmg/*.dmg' -type f 2>/dev/null || true
            else
              find target/release/bundle -type f -maxdepth 4 2>/dev/null || true
            fi
            exit 1
          fi

          for file in "${files[@]}"; do
            ext="${file##*.}"
            arch=""
            if [ "${{ matrix.platform }}" = "macos" ]; then
              base="$(basename "$file" ".$ext")"
              arch="-${base##*_}"
            fi
            cp "$file" "release-artifacts/PlainApp-${VERSION}-${{ matrix.platform }}${arch}.${ext}"
          done

      - name: Verify Linux installers
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          appimage=$(realpath release-artifacts/PlainApp-*.AppImage)
          dpkg-deb -x release-artifacts/PlainApp-*.deb "$temp/deb"
          mkdir "$temp/rpm"
          rpm=$(realpath release-artifacts/PlainApp-*.rpm)
          (cd "$temp/rpm"; rpm2cpio "$rpm" | cpio -id --quiet --no-absolute-filenames)
          (cd "$temp"; "$appimage" --appimage-extract >/dev/null)
          for root in "$temp/deb" "$temp/rpm" "$temp/squashfs-root"; do
            binary="$root/usr/bin/plainapp-desktop"
            test -x "$binary"
            bash scripts/check-linux-glibc.sh "$binary"
          done

      - name: Verify Windows installers
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem release-artifacts/PlainApp-*.exe).FullName
          & 7z l -ba $setup | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read the NSIS installer' }
          $msi = (Get-ChildItem release-artifacts/PlainApp-*.msi).FullName
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $installer.OpenDatabase($msi, 0) | Out-Null

      - name: Upload platform artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts-${{ matrix.platform }}
          path: plain-desktop/release-artifacts/*
          if-no-files-found: error
          retention-days: 1

      - name: Verify macOS notarization
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
                 target/x86_64-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No macOS DMG artifacts found"
            exit 1
          fi
          for file in "${files[@]}"; do
            xcrun stapler validate "$file"
            mount_dir="$(mktemp -d)"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$file" >/dev/null
            app_path="$(find "$mount_dir" -maxdepth 2 -type d -name '*.app' | head -n 1)"
            if [ -z "$app_path" ]; then
              hdiutil detach "$mount_dir" >/dev/null
              echo "::error::No .app bundle found inside $file"
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "$app_path"
            ents_xml="$(codesign -d --entitlements :- "$app_path" 2>&1 || true)"
            if grep -q 'com\.apple\.developer\.' <<<"$ents_xml"; then
              hdiutil detach "$mount_dir" >/dev/null
              echo "::error::$file carries restricted entitlements (com.apple.developer.*). Developer ID apps without an embedded provisioning profile are killed at launch by taskgated (CODESIGNING 1 / 'no eligible provisioning profiles found')."
              exit 1
            fi
            runtime="$(codesign -dvv "$app_path" 2>&1 | sed -n 's/^Runtime Version=//p' | head -n 1)"
            major="${runtime%%.*}"
            if [ -z "$runtime" ] || ! [[ "$runtime" =~ ^[0-9]+(\.[0-9]+)*$ ]] || [ "${major:-0}" -gt 15 ]; then
              hdiutil detach "$mount_dir" >/dev/null
              echo "::error::$file has Runtime Version=$runtime — macOS kills binaries whose runtime version exceeds the OS version (e.g. 26.x runtime is killed on macOS 15). Build with the macOS 15 SDK."
              exit 1
            fi
            echo "$file: Runtime Version=$runtime OK"
            spctl -a -vv -t open --context context:primary-signature "$app_path"
            hdiutil detach "$mount_dir" >/dev/null
          done

      - name: Cleanup macOS signing keychain
        if: matrix.platform == 'macos' && always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12"

  linux-smoke:
    name: Launch Linux release on Ubuntu 24.04
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts-linux
          path: release-artifacts

      - name: Install the DEB and wait for the desktop window
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ./release-artifacts/PlainApp-*.deb xvfb xauth xdotool
          profile=$(mktemp -d)
          trap 'rm -rf "$profile"' EXIT
          export XDG_DATA_HOME="$profile/data" XDG_CONFIG_HOME="$profile/config" XDG_CACHE_HOME="$profile/cache"
          export GDK_BACKEND=x11
          timeout 60s dbus-run-session -- xvfb-run -a bash -euo pipefail -c '
            plainapp-desktop >"$1" 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            for ((i=0; i<45; i++)); do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              if xdotool search --onlyvisible --pid "$pid" >/dev/null; then exit 0; fi
              sleep 1
            done
            cat "$1" >&2
            echo "PlainApp did not open a window" >&2
            exit 1
          ' bash "$profile/startup.log"

  provenance:
    name: Verify release installer provenance
    needs: [build, linux-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: Attest release installers
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/PlainApp-*

      - name: Verify installers against the build commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          jq -ce '.' "$BUNDLE" > release-provenance.jsonl
          shopt -s nullglob
          files=(release-artifacts/PlainApp-*)
          test "${#files[@]}" -gt 0
          verification=(
            --repo "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-desktop-release.yml"
            --source-digest "$GITHUB_SHA"
            --signer-digest "$GITHUB_SHA"
            --bundle release-provenance.jsonl
          )
          for file in "${files[@]}"; do
            gh attestation verify "$file" "${verification[@]}"
          done
          tampered=$(mktemp)
          trap 'rm -f "$tampered"' EXIT
          cp "${files[0]}" "$tampered"
          printf 'x' >> "$tampered"
          if gh attestation verify "$tampered" "${verification[@]}"; then
            echo "Attestation unexpectedly accepted an altered installer." >&2
            exit 1
          fi

      - name: Sign release manifest
        shell: bash
        env:
          LC_ALL: C
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
          VERSION: ${{ needs.build.outputs.version_name }}
        run: |
          : "${SIGNING_KEY:?Configure RELEASE_SIGNING_PRIVATE_KEY}"
          : "${PUBLIC_KEY:?Configure RELEASE_SIGNING_PUBLIC_KEY}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          public=$(openssl pkey -in "$key" -pubout -outform DER | openssl base64 -A)
          test "$public" = "$PUBLIC_KEY"
          test "$(printf '%s' "$public" | openssl base64 -d -A | od -An -tx1 -N12 | tr -d ' \n')" = 302a300506032b6570032100
          (
            cd release-artifacts
            shopt -s nullglob
            files=(PlainApp-"$VERSION"-*)
            test "${#files[@]}" -gt 0
            printf 'version %s\nrepository %s\n' "$VERSION" "$GITHUB_REPOSITORY"
            sha256sum -- "${files[@]}"
          ) > release-manifest.txt
          openssl pkeyutl -sign -inkey "$key" -rawin -in release-manifest.txt -out release-manifest.sig
          test "$(wc -c < release-manifest.sig)" -eq 64
          openssl pkeyutl -verify -pubin -inkey <(openssl pkey -in "$key" -pubout) -rawin \
            -in release-manifest.txt -sigfile release-manifest.sig

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-provenance
          path: |
            release-provenance.jsonl
            release-manifest.txt
            release-manifest.sig
          if-no-files-found: error
          retention-days: 1
