name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-check:
    name: frontend checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: plain-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          path: plain-desktop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve locked Core revision
        id: core
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs'
          const lock = readFileSync('Cargo.lock', 'utf8')
          const revisions = new Set([...lock.matchAll(/source = "git\+https:\/\/github\.com\/plainhub\/plain-core\.git\?branch=main#([a-f0-9]{40})"/g)].map((match) => match[1]))
          if (revisions.size !== 1) throw new Error('Expected one locked Core revision')
          appendFileSync(process.env.GITHUB_OUTPUT, `revision=${[...revisions][0]}\n`)
          JS

      - name: Checkout shared Core assets
        uses: actions/checkout@v4
        with:
          repository: plainhub/plain-core
          ref: ${{ steps.core.outputs.revision }}
          path: plain-core

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            plain-desktop/.yarn/cache
            plain-desktop/.yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('plain-desktop/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Typecheck frontend
        run: yarn typecheck

      - name: Build web frontend
        run: yarn build

      - name: Build Tauri frontend
        run: VITE_APP_MODE=tauri yarn build

      - name: Run frontend unit tests (web)
        run: yarn test

      - name: Run frontend unit tests (Tauri)
        run: VITE_APP_MODE=tauri yarn test

  cargo-check:
    name: cargo check (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-2022
          - platform: linux
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev
          echo 'CC=gcc-14' >> "$GITHUB_ENV"
          echo 'CXX=g++-14' >> "$GITHUB_ENV"

      - name: Run cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Assert the capture layer stays Tauri-free
        shell: bash
        run: '! grep -rn "tauri" src-tauri/src/capture/'

      - name: Run screen capture Rust tests
        run: 'cargo test --manifest-path src-tauri/Cargo.toml --locked --lib commands::screen_capture::'

      - name: Run full Rust test suite
        if: matrix.platform == 'linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Simulate Linux engine build dependencies
        if: always() && matrix.platform == 'linux'
        shell: bash
        run: |
          for tool in cmake ninja; do
            if ! command -v "$tool" || ! "$tool" --version; then
              printf '%s unavailable; build prerequisites remain unverified.\n' "$tool"
            fi
          done
          dpkg-query -W -f='${Package}\t${Architecture}\t${Version}\t${db:Status-Abbrev}\n'
          python3 - <<'PYTHON'
          import os
          import re
          import shlex
          import subprocess

          env = {**os.environ, 'LC_ALL': 'C'}
          seeds = """
          clang-18 pkgconf python3 perl ruby gperf unifdef dpkg-dev patch
          libgtk-3-dev libsoup-3.0-dev libgirepository1.0-dev libtasn1-6-dev
          libwebp-dev libmanette-0.2-dev libxslt1-dev libsecret-1-dev
          libenchant-2-dev libhyphen-dev liblcms2-dev libsystemd-dev
          libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev
          libseccomp-dev bubblewrap xdg-dbus-proxy
          """.split()
          command = ['apt-get', '--simulate', '--no-install-recommends', 'install', *seeds]
          print(shlex.join(command), flush=True)
          result = subprocess.run(command, env=env, capture_output=True, text=True)
          print(result.stdout, end='', flush=True)
          print(result.stderr, end='', flush=True)
          result.check_returncode()
          planned = re.findall(r'^Inst (\S+)(?: \[[^]]+\])? \((\S+)', result.stdout, re.MULTILINE)
          packages = sorted(set(seeds) | {name for name, _ in planned})
          subprocess.run(['apt-cache', 'policy', *packages], env=env, check=True)
          fields = {'Package', 'Architecture', 'Version', 'Source', 'Depends', 'Pre-Depends',
                    'Provides', 'Breaks', 'Conflicts', 'Replaces', 'Filename', 'Size', 'SHA256'}
          for name, version in planned:
              metadata = subprocess.check_output(['apt-cache', 'show', f'{name}={version}'], env=env, text=True)
              include = False
              for line in metadata.splitlines():
                  if not line.startswith((' ', '\t')):
                      include = line.partition(':')[0] in fields
                  if include:
                      print(line)
              print()
          PYTHON
