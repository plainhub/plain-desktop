name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-check:
    name: frontend capture checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Typecheck frontend
        run: yarn typecheck

      - name: Build web frontend
        run: yarn build

      - name: Build Tauri frontend
        run: VITE_APP_MODE=tauri yarn build

      # The focused unit project runs in real Chromium. Install it only after
      # the cheaper static/build gates pass so failures there do not trigger an
      # unnecessary browser and system-package installation.
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run screen capture tests (web)
        run: >-
          yarn test
          --project=unit
          tests/lib/screen-capture
          tests/lib/upload/upload-queue.test.ts
          tests/views/screen-capture
          tests/views/chat/chat-input-capture.test.ts
          tests/views/chat/chat-upload-destination.test.ts
          tests/views/chat/chat-tasks.test.ts
          tests/views/image-editor/annotation-session.test.ts

      - name: Run Tauri capture component test
        run: >-
          VITE_APP_MODE=tauri yarn test
          --project=unit
          tests/views/chat/chat-input-capture.test.ts

  cargo-check:
    name: cargo check (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

      - name: Run cargo check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Run screen capture Rust tests
        run: 'cargo test --locked --manifest-path src-tauri/Cargo.toml --lib commands::screen_capture::'

      - name: Run full Rust test suite
        if: matrix.platform == 'linux'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
