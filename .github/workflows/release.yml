name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build desktop app (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set version name
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT

      - name: Enable Corepack
        shell: bash
        run: corepack enable

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install frontend dependencies
        shell: bash
        run: yarn install --immutable

      - name: Typecheck frontend
        shell: bash
        run: yarn typecheck

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Select Xcode with macOS 15 SDK
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          for xc in /Applications/Xcode*.app; do
            sdk="$(DEVELOPER_DIR="$xc" xcrun --sdk macosx --show-sdk-version)"
            if [[ "$sdk" == 15.* ]]; then
              sudo xcode-select -s "$xc"
              break
            fi
          done
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          if [[ "$sdk" != 15.* ]]; then
            echo "::error::No Xcode with macOS 15 SDK found (active SDK: $sdk). Binaries signed with Runtime Version > 15 are killed at launch on macOS 15."
            exit 1
          fi
          xcodebuild -version
          echo "Active macOS SDK: $sdk"

      - name: Add macOS Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

      - name: Run screen capture Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib commands::screen_capture::

      - name: Install Chromium for release capture tests
        if: matrix.platform == 'linux'
        run: yarn playwright install --with-deps chromium

      - name: Run release capture tests
        if: matrix.platform == 'linux'
        run: >-
          yarn test
          --project=unit
          tests/lib/screen-capture
          tests/lib/upload/upload-queue.test.ts
          tests/views/screen-capture
          tests/views/chat/chat-input-capture.test.ts
          tests/views/chat/chat-upload-destination.test.ts
          tests/views/chat/chat-tasks.test.ts
          tests/views/image-editor/annotation-session.test.ts

      - name: Validate macOS signing secrets
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import macOS signing certificate
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/build_certificate.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning

      - name: Build desktop app
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash build-desktop.sh

      - name: Notarize and staple macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
                 src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No macOS DMG artifacts found"
            exit 1
          fi
          for file in "${files[@]}"; do
            xcrun codesign --force --sign "$APPLE_SIGNING_IDENTITY" "$file"
            xcrun notarytool submit "$file" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$file"
          done

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version_name }}"
          mkdir -p release-artifacts
          shopt -s nullglob

          case "${{ matrix.platform }}" in
            macos)
              files=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
                     src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg)
              ;;
            windows)
              files=(src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe)
              ;;
            linux)
              files=(src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm src-tauri/target/release/bundle/appimage/*.AppImage)
              ;;
          esac

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No bundle artifacts found for ${{ matrix.platform }}" >&2
            if [ "${{ matrix.platform }}" = "macos" ]; then
              find src-tauri/target -path '*/bundle/dmg/*.dmg' -type f 2>/dev/null || true
            else
              find src-tauri/target/release/bundle -type f -maxdepth 4 2>/dev/null || true
            fi
            exit 1
          fi

          for file in "${files[@]}"; do
            ext="${file##*.}"
            arch=""
            if [ "${{ matrix.platform }}" = "macos" ]; then
              base="$(basename "$file" ".$ext")"
              arch="-${base##*_}"
            fi
            cp "$file" "release-artifacts/PlainApp-${VERSION}-${{ matrix.platform }}${arch}.${ext}"
          done

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

      - name: Verify macOS notarization
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
                 src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No macOS DMG artifacts found"
            exit 1
          fi
          for file in "${files[@]}"; do
            xcrun stapler validate "$file"
            mount_dir="$(mktemp -d)"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$file" >/dev/null
            app_path="$(find "$mount_dir" -maxdepth 2 -type d -name '*.app' | head -n 1)"
            if [ -z "$app_path" ]; then
              hdiutil detach "$mount_dir" >/dev/null
              echo "::error::No .app bundle found inside $file"
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "$app_path"
            ents_xml="$(codesign -d --entitlements :- "$app_path" 2>&1 || true)"
            if grep -q 'com\.apple\.developer\.' <<<"$ents_xml"; then
              hdiutil detach "$mount_dir" >/dev/null
              echo "::error::$file carries restricted entitlements (com.apple.developer.*). Developer ID apps without an embedded provisioning profile are killed at launch by taskgated (CODESIGNING 1 / 'no eligible provisioning profiles found')."
              exit 1
            fi
            runtime="$(codesign -dvv "$app_path" 2>&1 | sed -n 's/^Runtime Version=//p' | head -n 1)"
            major="${runtime%%.*}"
            if [ -z "$runtime" ] || ! [[ "$runtime" =~ ^[0-9]+(\.[0-9]+)*$ ]] || [ "${major:-0}" -gt 15 ]; then
              hdiutil detach "$mount_dir" >/dev/null
              echo "::error::$file has Runtime Version=$runtime — macOS kills binaries whose runtime version exceeds the OS version (e.g. 26.x runtime is killed on macOS 15). Build with the macOS 15 SDK."
              exit 1
            fi
            echo "$file: Runtime Version=$runtime OK"
            spctl -a -vv -t open --context context:primary-signature "$app_path"
            hdiutil detach "$mount_dir" >/dev/null
          done

      - name: Cleanup macOS signing keychain
        if: matrix.platform == 'macos' && always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12"

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_name: ${{ needs.build.outputs.version_name }}
      hashes: ${{ steps.hashes.outputs.hashes }}
      artifact_names: ${{ steps.artifacts.outputs.artifact_names }}
      release_body_files: ${{ steps.artifacts.outputs.release_body_files }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: Compute SHA-256 hashes
        id: hashes
        run: |
          echo "hashes=$(sha256sum release-artifacts/* | base64 -w0)" >> $GITHUB_OUTPUT

      - name: Prepare artifact metadata
        id: artifacts
        run: |
          {
            echo "artifact_names<<EOF"
            find release-artifacts -maxdepth 1 -type f -printf '%f\n' | sort
            echo "EOF"
          } >> $GITHUB_OUTPUT
          {
            echo "release_body_files<<EOF"
            find release-artifacts -maxdepth 1 -type f -printf '| `%f` |\n' | sort
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  provenance:
    needs: package
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.package.outputs.hashes }}
      upload-assets: false

  virustotal:
    needs: package
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      markdown: ${{ steps.scan.outputs.markdown }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Scan with VirusTotal
        id: scan
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VT_API_KEY:-}" ]; then
            {
              echo "markdown<<EOF"
              find release-artifacts -maxdepth 1 -type f -printf '| `%f` | ⬜ Skipped | VirusTotal API key is not configured |\n' | sort
              echo "EOF"
            } >> $GITHUB_OUTPUT
            exit 0
          fi

          upload_and_poll() {
            local file="$1" outprefix="$2"
            local name sha256 size_bytes upload_url analysis_id last_response poll_status
            local malicious suspicious undetected harmless total detected result_status report_url
            name=$(basename "$file")
            sha256=$(sha256sum "$file" | awk '{print $1}')
            size_bytes=$(stat -c%s "$file")
            upload_url="https://www.virustotal.com/api/v3/files"
            if [ "$size_bytes" -gt 33554432 ]; then
              upload_url=$(curl -sS --request GET \
                --url https://www.virustotal.com/api/v3/files/upload_url \
                --header "x-apikey: $VT_API_KEY" | jq -r '.data')
              if [ -z "$upload_url" ] || [ "$upload_url" = "null" ]; then
                printf '| `%s` | ⬜ N/A | [View Report](https://www.virustotal.com/gui/file/%s/detection) |\n' "$name" "$sha256" > "${outprefix}.md"
                return
              fi
            fi
            analysis_id=$(curl -sS --request POST \
              --url "$upload_url" \
              --header "x-apikey: $VT_API_KEY" \
              --form "file=@$file" | jq -r '.data.id')
            if [ -z "$analysis_id" ] || [ "$analysis_id" = "null" ]; then
              printf '| `%s` | ⬜ N/A | [View Report](https://www.virustotal.com/gui/file/%s/detection) |\n' "$name" "$sha256" > "${outprefix}.md"
              return
            fi
            last_response=""
            for _ in $(seq 1 30); do
              sleep 20
              last_response=$(curl -sS \
                --url "https://www.virustotal.com/api/v3/analyses/$analysis_id" \
                --header "x-apikey: $VT_API_KEY")
              poll_status=$(echo "$last_response" | jq -r '.data.attributes.status')
              [ "$poll_status" = "completed" ] && break
            done
            malicious=$(echo  "$last_response" | jq -r '.data.attributes.stats.malicious   // 0')
            suspicious=$(echo "$last_response" | jq -r '.data.attributes.stats.suspicious  // 0')
            undetected=$(echo "$last_response" | jq -r '.data.attributes.stats.undetected  // 0')
            harmless=$(echo   "$last_response" | jq -r '.data.attributes.stats.harmless    // 0')
            total=$((malicious + suspicious + undetected + harmless))
            detected=$((malicious + suspicious))
            [ "$detected" -eq 0 ] \
              && result_status="✅ ${detected}/${total} Clean" \
              || result_status="⚠️ ${detected}/${total} Detected"
            report_url="https://www.virustotal.com/gui/file/$sha256/detection"
            printf '| `%s` | %s | [View Report](%s) |\n' "$name" "$result_status" "$report_url" > "${outprefix}.md"
          }

          i=0
          for file in release-artifacts/*; do
            upload_and_poll "$file" "/tmp/vt_${i}" &
            i=$((i + 1))
          done
          wait
          {
            echo "markdown<<EOF"
            cat /tmp/vt_*.md | sort
            echo "EOF"
          } >> $GITHUB_OUTPUT

  r2-upload:
    name: Upload artifacts to Cloudflare R2
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ vars.R2_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Validate R2 configuration
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          missing=0
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT_URL R2_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing R2 configuration: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload to R2
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
        run: |
          set -euo pipefail
          dest="s3://${R2_BUCKET}/${R2_PREFIX}"
          [[ "$dest" != */ ]] && dest="${dest}/"
          aws --version
          aws s3 cp release-artifacts "$dest" --recursive --cache-control "public, max-age=31536000, immutable"

  release:
    needs: [package, provenance, virustotal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.package.outputs.version_name }}
          name: Desktop Release ${{ needs.package.outputs.version_name }}
          body: |
            ## What's Changed

            ## Security

            ### VirusTotal Scan
            | File | Status | Scan Report |
            |------|--------|-------------|
            ${{ needs.virustotal.outputs.markdown }}

            ### SLSA Provenance (Level 3)
            The `.intoto.jsonl` file is a signed SLSA provenance document covering all desktop release artifacts.
            Verify with [slsa-verifier](https://github.com/slsa-framework/slsa-verifier).
          draft: true
          prerelease: false
          artifacts: 'PlainApp-*,${{ needs.provenance.outputs.provenance-name }}'
