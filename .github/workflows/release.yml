name: Release

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Build and verify installers without uploading to R2, scanning or drafting a release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-desktop-release.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  virustotal:
    if: ${{ !inputs.verify_only }}
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      markdown: ${{ steps.scan.outputs.markdown }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Scan with VirusTotal
        id: scan
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VT_API_KEY:-}" ]; then
            {
              echo "markdown<<EOF"
              find release-artifacts -maxdepth 1 -type f -printf '| `%f` | ⬜ Skipped | VirusTotal API key is not configured |\n' | sort
              echo "EOF"
            } >> $GITHUB_OUTPUT
            exit 0
          fi

          upload_and_poll() {
            local file="$1" outprefix="$2"
            local name sha256 size_bytes upload_url analysis_id last_response poll_status
            local malicious suspicious undetected harmless total detected result_status report_url
            name=$(basename "$file")
            sha256=$(sha256sum "$file" | awk '{print $1}')
            size_bytes=$(stat -c%s "$file")
            upload_url="https://www.virustotal.com/api/v3/files"
            if [ "$size_bytes" -gt 33554432 ]; then
              upload_url=$(curl -sS --request GET \
                --url https://www.virustotal.com/api/v3/files/upload_url \
                --header "x-apikey: $VT_API_KEY" | jq -r '.data')
              if [ -z "$upload_url" ] || [ "$upload_url" = "null" ]; then
                printf '| `%s` | ⬜ N/A | [View Report](https://www.virustotal.com/gui/file/%s/detection) |\n' "$name" "$sha256" > "${outprefix}.md"
                return
              fi
            fi
            analysis_id=$(curl -sS --request POST \
              --url "$upload_url" \
              --header "x-apikey: $VT_API_KEY" \
              --form "file=@$file" | jq -r '.data.id')
            if [ -z "$analysis_id" ] || [ "$analysis_id" = "null" ]; then
              printf '| `%s` | ⬜ N/A | [View Report](https://www.virustotal.com/gui/file/%s/detection) |\n' "$name" "$sha256" > "${outprefix}.md"
              return
            fi
            last_response=""
            for _ in $(seq 1 30); do
              sleep 20
              last_response=$(curl -sS \
                --url "https://www.virustotal.com/api/v3/analyses/$analysis_id" \
                --header "x-apikey: $VT_API_KEY")
              poll_status=$(echo "$last_response" | jq -r '.data.attributes.status')
              [ "$poll_status" = "completed" ] && break
            done
            malicious=$(echo  "$last_response" | jq -r '.data.attributes.stats.malicious   // 0')
            suspicious=$(echo "$last_response" | jq -r '.data.attributes.stats.suspicious  // 0')
            undetected=$(echo "$last_response" | jq -r '.data.attributes.stats.undetected  // 0')
            harmless=$(echo   "$last_response" | jq -r '.data.attributes.stats.harmless    // 0')
            total=$((malicious + suspicious + undetected + harmless))
            detected=$((malicious + suspicious))
            [ "$detected" -eq 0 ] \
              && result_status="✅ ${detected}/${total} Clean" \
              || result_status="⚠️ ${detected}/${total} Detected"
            report_url="https://www.virustotal.com/gui/file/$sha256/detection"
            printf '| `%s` | %s | [View Report](%s) |\n' "$name" "$result_status" "$report_url" > "${outprefix}.md"
          }

          i=0
          for file in release-artifacts/*; do
            upload_and_poll "$file" "/tmp/vt_${i}" &
            i=$((i + 1))
          done
          wait
          {
            echo "markdown<<EOF"
            cat /tmp/vt_*.md | sort
            echo "EOF"
          } >> $GITHUB_OUTPUT

  release:
    if: ${{ !inputs.verify_only }}
    needs: [build, virustotal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-provenance

      - name: Create GitHub Release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version_name }}
          SCAN_MARKDOWN: ${{ needs.virustotal.outputs.markdown }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists." >&2
            exit 1
          fi
          refs=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" "refs/tags/$tag^{}")
          if [[ -n "$refs" && "$(printf '%s\n' "$refs" | sort -k2 | tail -n1 | cut -f1)" != "$GITHUB_SHA" ]]; then
            echo "Tag $tag points to a different commit." >&2
            exit 1
          fi
          {
            cat <<'NOTES'
          ## What's Changed

          ## Security

          ### VirusTotal Scan
          | File | Status | Scan Report |
          |------|--------|-------------|
          NOTES
            printf '%s\n' "$SCAN_MARKDOWN"
            cat <<'NOTES'

          ### Build provenance
          Download an installer and `release-provenance.jsonl` and verify with the GitHub CLI:
          ```sh
          NOTES
            printf '%s\n' "gh attestation verify INSTALLER \\" \
              "  --repo $GITHUB_REPOSITORY \\" \
              "  --signer-workflow $GITHUB_REPOSITORY/.github/workflows/build-desktop-release.yml \\" \
              "  --source-digest $GITHUB_SHA --signer-digest $GITHUB_SHA \\" \
              "  --bundle release-provenance.jsonl"
            cat <<'NOTES'
          ```
          NOTES
          } > release-notes.md
          shopt -s nullglob
          assets=(PlainApp-*)
          test "${#assets[@]}" -gt 0
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Desktop Release $VERSION" --notes-file release-notes.md -- "${assets[@]}" release-provenance.jsonl

  r2-upload:
    name: Upload verified installers to Cloudflare R2
    if: ${{ !inputs.verify_only }}
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts

      - name: Upload verified installers to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ vars.R2_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Configure R2_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Configure R2_SECRET_ACCESS_KEY}"
          : "${AWS_ENDPOINT_URL_S3:?Configure R2_ENDPOINT_URL}"
          : "${R2_BUCKET:?Configure R2_BUCKET}"
          dest="s3://$R2_BUCKET/${R2_PREFIX:+${R2_PREFIX%/}/}"
          for file in PlainApp-*; do
            aws s3 cp "$file" "$dest" --cache-control "public, max-age=31536000, immutable"
          done
