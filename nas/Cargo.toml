[package]
name = "plainnas"
version = "0.1.0"
edition = "2024"
default-run = "plainnas"
# Pinned to the current stable Rust (1.96.0, released 2026-05-28). Bump
# together with `edition` whenever we want to opt into a newer edition's
# new lints / resolver changes.
rust-version = "1.96"

[[bin]]
name = "plainnas"
path = "src/main.rs"

[dependencies]
# HTTP & Web
axum = { version = "0.7", features = ["json", "query", "ws", "multipart", "tokio", "http1"] }
tokio = { version = "1", features = ["full"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }

# GraphQL lives in the shared plain-rs API schema.

plain_rs = { path = "../plain-rs", package = "plain-rs", features = ["chat", "library", "prefs", "sqlite_browse", "media", "media_gql", "system"] }
serde_json = "1"

# Platform FFI (already a transitive of nix/tokio/ring — listing explicitly
# so we can call libc::tcgetattr / setsockopt / etc. without forcing
# `cargo add` later on. Zero-cost addition: same crate version as already
# resolved.)
libc = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }
# `rpassword` was removed in step 2. Password input now uses the in-tree
# `crate::read_password` module (see src/read_password.rs), which talks to
# /dev/tty via libc::tcgetattr/tcsetattr — same behaviour, no third-party dep.

# TLS
# Self-signed cert generation lives in plain-rs (plain_rs::tls); only the
# rustls server side remains here.
# default-features would pull aws-lc-rs alongside ring; two providers leave
# rustls unable to pick a process default, which panics every TLS test that
# relies on one. ring is what the code actually uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# log crate facade bridge (plain-rs media code logs via log::)
log = "0.4"

anyhow = "1"
nix = { version = "0.28", features = ["mount", "fs", "user"] }
