<!doctype html>
<html lang="en" data-state="running">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlainApp</title>
<style>
  :root { color-scheme: light dark; }
  body { box-sizing: border-box; margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px system-ui; text-align: center; }
  main { padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; }
  progress { width: 180px; accent-color: #287eff; }
  button { font: inherit; padding: 6px 18px; cursor: pointer; }
  [data-state="running"] #failed, [data-state="failed"] #running { display: none; }
</style>
<main aria-live="polite">
  <section id="running">
    <h1 id="progress-title">Migrating chat history</h1>
    <progress aria-labelledby="progress-title"></progress>
  </section>
  <section id="failed">
    <h1 id="failure-title">Migration failed. Your old data was not deleted.</h1>
    <button type="button" id="retry">Retry</button>
  </section>
</main>
<script>
  const language = navigator.language.toLowerCase()
  const chinese = language.startsWith('zh')
  const traditional = /^zh-(tw|hk|mo|hant)/.test(language)
  const retry = document.getElementById('retry')
  if (chinese) {
    document.documentElement.lang = traditional ? 'zh-Hant' : 'zh-Hans'
    document.getElementById('progress-title').textContent = traditional ? '正在遷移聊天記錄' : '正在迁移聊天记录'
    document.getElementById('failure-title').textContent = traditional ? '遷移失敗，舊資料未刪除' : '迁移失败，旧数据未删除'
    retry.textContent = traditional ? '重試' : '重试'
  }
  retry.addEventListener('click', () => {
    document.documentElement.dataset.state = 'running'
    location.search = '?retry=1'
  })
</script>
</html>
