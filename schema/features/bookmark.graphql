type ActionResult {
	affectedCount: Int!
}

type Bookmark {
	id: ID!
	url: String!
	title: String!
	faviconPath: String!
	groupId: ID!
	pinned: Boolean!
	clickCount: Int!
	sortOrder: Int!
	createdAt: Instant!
	updatedAt: Instant!
	lastClickedAt: Instant
}

type BookmarkGroup {
	id: ID!
	name: String!
	collapsed: Boolean!
	sortOrder: Int!
	itemCount: Int!
	createdAt: Instant!
	updatedAt: Instant!
}

input BookmarkInput {
	url: String!
	title: String!
	groupId: ID!
	pinned: Boolean!
	sortOrder: Int!
}

type BookmarkMutation {
	addBookmarks(urls: [String!]!, groupId: ID!): [Bookmark!]!
	updateBookmark(id: ID!, input: BookmarkInput!): Bookmark!
	deleteBookmarks(ids: [ID!]!): ActionResult!
	recordBookmarkClick(id: ID!): Boolean!
	createBookmarkGroup(name: String!): BookmarkGroup!
	updateBookmarkGroup(id: ID!, name: String!, collapsed: Boolean!, sortOrder: Int!): BookmarkGroup!
	deleteBookmarkGroup(id: ID!): Boolean!
}

type BookmarkQuery {
	bookmarks: [Bookmark!]!
	bookmarkGroups: [BookmarkGroup!]!
}

