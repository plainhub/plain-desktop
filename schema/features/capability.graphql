type AppUpdate {
	currentVersion: String!
	latestVersion: String
	hasUpdate: Boolean!
	url: String
}

type AuditEvent {
	id: ID!
	type: AuditEventType!
	message: String!
	clientId: String!
	createdAt: Instant!
}

enum AuditEventType {
	LOGIN
	LOGIN_FAILED
	LOGOUT
	REVOKE
	SET_HOSTNAME
	UPDATE_DEVICE_NAME
	MOUNT
	MOUNT_FAILED
	UNMOUNT
	FORMAT_DISK
	FORMAT_DISK_FAILED
}

type CapabilityMutation {
	setHostname(name: String!): Boolean!
	logout: Boolean!
	revokeSession(clientId: String!): Boolean!
	formatDisk(path: String!): Boolean!
	setMountAlias(id: ID!, alias: String!): Boolean!
	setTempValue(key: String!, value: String!): KeyValuePair!
	setSambaSettings(input: SambaSettingsInput!): Boolean!
	setSambaUserPassword(password: String!): Boolean!
	dlnaCast(rendererUdn: String!, url: String!, title: String!, mime: String!, type: MediaDataType!): Boolean!
}

type CapabilityQuery {
	audioLyrics(path: String!): String
	disks: [Disk!]!
	sessions: [Session!]!
	auditEvents(offset: Int!, limit: Int!, query: String!): [AuditEvent!]!
	appUpdate: AppUpdate!
	sambaSettings: SambaSettings!
	dlnaRenderers: [DlnaRenderer!]!
}

type Disk {
	id: ID!
	name: String!
	path: String!
	sizeBytes: Long!
	removable: Boolean!
	model: String
}

type DlnaRenderer {
	udn: String!
	name: String!
	manufacturer: String
	modelName: String
	location: String!
}

type KeyValuePair {
	key: String!
	value: String!
}

"""
Media-library item kinds accepted by media item actions and buckets
(plain-app `MediaDataType`).
"""
enum MediaDataType {
	AUDIO
	VIDEO
	IMAGE
	DOC
}

type SambaSettings {
	enabled: Boolean!
	username: String!
	hasPassword: Boolean!
	shares: [SambaShare!]!
	serviceName: String!
	serviceActive: Boolean!
	serviceEnabled: Boolean!
}

input SambaSettingsInput {
	enabled: Boolean!
	shares: [SambaShareInput!]!
}

type SambaShare {
	name: String!
	sharePath: String!
	auth: SambaShareAuth!
	readOnly: Boolean!
}

enum SambaShareAuth {
	GUEST
	PASSWORD
}

input SambaShareInput {
	name: String!
	sharePath: String!
	auth: SambaShareAuth!
	readOnly: Boolean!
}

type Session {
	clientId: String!
	clientName: String!
	lastActive: Instant!
	createdAt: Instant!
	updatedAt: Instant!
}

