[package]
name = "PlainApp"
version = "0.1.10"
description = "PlainApp Desktop"
authors = ["iSmartCoding"]
edition = "2024"
rust-version = "1.96"

[lib]
name = "plainapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
if-addrs = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
native-tls = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["sync", "macros", "net"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-store = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Shared Rust primitives (crypto + utils + mdns).

plain_rs = { git = "https://github.com/plainhub/plain-rs", package = "plain-rs" }

# Self-signed TLS certificate generation for local HTTPS server.
# ring feature enables the required crypto backend (generate_simple_self_signed needs it).
# Async TLS acceptor wrapping tokio streams. Uses the ring backend; the
# self-signed certificate itself is generated by the shared plain_rs::tls.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
# SQLite for local chat/channel storage. Bundled builds SQLite from source — no system dependency.
rusqlite = { version = "0.32", features = ["bundled"] }
# SHA-256 for content-addressable file store.
sha2 = "0.10"
# URL / Open-Graph tag extraction for link previews.
regex = "1"
# CSPRNG used in prefs tests.
rand = "0.8"
# Typed GraphQL schema with derive macros for clean resolver code.
async-graphql = { version = "7", default-features = false }
# Cross-platform system information (OS version, uptime, CPU brand).
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
# UDP socket options (SO_REUSEADDR for multicast receiver).
socket2 = { version = "0.5", features = ["all"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL"] }

# Official single-instance guard: a second launch focuses the running app
# instead of spawning another process that walks the local-server port range.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
