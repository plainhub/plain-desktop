# Extension schema: the plain-app phone API surface the shared Rust server does not define yet.
#
# The homegrown codegen validates frontend GraphQL documents against
# local-schema.graphql ⊕ this file. Sources of truth, in order:
# plain-app `shared/src/commonMain` Kotlin models/resolvers,
# the frontend's own `lib/interfaces.ts`.
#
# Migration rule: when the desktop backend implements a type or field
# declared here, DELETE it from this file — the merge step fails on any
# overlap, forcing the removal. Root field args mirror what the frontend
# documents actually declare (variable nullability included).

type Mount {
  label: String
  partitionNum: Int
  uuid: String
}

enum SmsType {
  INBOX
  SENT
  DRAFT
  OUTBOX
  FAILED
  QUEUED
  UNKNOWN
}

enum PhoneType {
  CUSTOM
  HOME
  MOBILE
  WORK
  FAX_WORK
  FAX_HOME
  PAGER
  OTHER
  CALLBACK
  CAR
  COMPANY_MAIN
  ISDN
  MAIN
  OTHER_FAX
  RADIO
  TELEX
  TTY_TDD
  WORK_MOBILE
  WORK_PAGER
  ASSISTANT
}

enum EmailType {
  CUSTOM
  HOME
  WORK
  OTHER
  MOBILE
}

enum PostalType {
  CUSTOM
  HOME
  WORK
  OTHER
}

enum EventType {
  CUSTOM
  ANNIVERSARY
  BIRTHDAY
  OTHER
}

enum PomodoroState {
  WORK
  SHORT_BREAK
  LONG_BREAK
}

enum WebsiteType {
  CUSTOM
  HOMEPAGE
  BLOG
  FTP
  HOME
  WORK
  OTHER
}

enum ImProtocol {
  CUSTOM
  AIM
  MSN
  YAHOO
  SKYPE
  QQ
  GOOGLE_TALK
  ICQ
  JABBER
  NETMEETING
}

enum CallType {
  INCOMING
  OUTGOING
  MISSED
  VOICEMAIL
  REJECTED
  BLOCKED
  ANSWERED_EXTERNALLY
  UNKNOWN
}

enum PackageType {
  SYSTEM
  USER
}

enum ScreenMirrorMode {
  HD
  SMOOTH
}

enum WebSettingsFeature {
  FILES
  CONTACTS
  SMS
  CALL_LOGS
  CALL_PHONE
  PHONE_NUMBER
  APPS
  NOTIFICATIONS
  CLIPBOARD
}

type Sms {
  id: ID!
  body: String!
  address: String!
  serviceCenter: String!
  sentAt: String!
  type: SmsType!
  threadId: String!
  subscriptionId: Int!
  isMms: Boolean!
  attachments: [SmsAttachment!]!
  tags: [Tag!]!
}

type SmsAttachment {
  path: String!
  contentType: String!
  name: String!
}

type SmsConversation {
  id: ID!
  address: String!
  addresses: [String!]!
  snippet: String!
  lastMessageAt: String!
  messageCount: Int!
  read: Boolean!
}

type SmsCounts {
  total: Int!
  inbox: Int!
  sent: Int!
  drafts: Int!
}

type Contact {
  id: ID!
  suffix: String!
  prefix: String!
  firstName: String!
  middleName: String!
  lastName: String!
  updatedAt: String!
  notes: String!
  source: String!
  thumbnailId: String!
  starred: Boolean!
  phoneNumbers: [ContactPhoneNumber!]!
  addresses: [ContactAddress!]!
  emails: [ContactEmail!]!
  websites: [ContactWebsite!]!
  events: [ContactEvent!]!
  ims: [ContactIm!]!
  tags: [Tag!]!
}

type ContactPhoneNumber {
  value: String!
  type: PhoneType!
  label: String!
  normalizedNumber: String!
}

type ContactAddress {
  value: String!
  type: PostalType!
  label: String!
}

type ContactEmail {
  value: String!
  type: EmailType!
  label: String!
}

type ContactWebsite {
  value: String!
  type: WebsiteType!
  label: String!
}

type ContactEvent {
  value: String!
  type: EventType!
  label: String!
}

type ContactIm {
  value: String!
  protocol: ImProtocol!
  customProtocol: String!
}

type ContactSource {
  name: String!
  type: String!
}

type Call {
  id: ID!
  name: String!
  number: String!
  durationSec: Int!
  accountId: String!
  startedAt: String!
  photoId: String!
  type: CallType!
  geo: PhoneGeo
  tags: [Tag!]!
}

type PhoneGeo {
  country: String!
  numberType: String!
  carrier: String!
  description: String!
}

type ClipboardItem {
  id: ID!
  text: String!
  source: String!
  label: String!
  sensitive: Boolean!
  createdAt: String!
}

type Note {
  id: ID!
  title: String!
  content: String!
  deletedAt: String
  createdAt: String!
  updatedAt: String!
  tags: [Tag!]!
}

type Feed {
  id: ID!
  name: String!
  url: String!
  fetchContent: Boolean!
  createdAt: String!
  updatedAt: String!
}

type FeedEntry {
  id: ID!
  title: String!
  url: String!
  image: String!
  author: String!
  description: String!
  content: String!
  feedId: ID!
  rawId: String!
  publishedAt: String!
  createdAt: String!
  updatedAt: String!
  tags: [Tag!]!
  feed: Feed
}

type FeedEntryCount {
  id: ID!
  count: Int!
}

type Package {
  id: ID!
  name: String!
  type: PackageType!
  version: String!
  path: String!
  size: Long!
  certs: [Certificate!]!
  installedAt: String!
  updatedAt: String!
}

type Certificate {
  issuer: String!
  subject: String!
  serialNumber: String!
  validFrom: String!
  validTo: String!
}

type PackageStatus {
  id: ID!
  exists: Boolean!
  updatedAt: String
}

type PackageInstallPending {
  id: ID!
  updatedAt: String
