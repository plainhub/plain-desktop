}

type Notification {
  id: ID!
  onlyOnce: Boolean!
  isClearable: Boolean!
  appId: String!
  appName: String!
  postedAt: String!
  silent: Boolean!
  title: String!
  body: String!
  actions: [String!]!
  replyActions: [String!]!
}

type PomodoroSettings {
  workDurationMin: Int!
  shortBreakDurationMin: Int!
  longBreakDurationMin: Int!
  pomodorosBeforeLongBreak: Int!
  showNotification: Boolean!
  playSoundOnComplete: Boolean!
}

type PomodoroToday {
  date: String!
  completedCount: Int!
  currentRound: Int!
  timeLeftSec: Int!
  totalTimeSec: Int!
  isRunning: Boolean!
  isPaused: Boolean!
  state: PomodoroState!
}

type ScreenMirrorQuality {
  mode: ScreenMirrorMode!
