# Extension schema: the API surface served by plain-app (phone) and
# plain-nas that the desktop local backend does not define (yet).
#
# The homegrown codegen validates frontend GraphQL documents against
# local-schema.graphql ⊕ this file. Sources of truth, in order:
# plain-app `shared/src/commonMain` Kotlin models/resolvers,
# plain-nas `src/gql`, and the frontend's own `lib/interfaces.ts`.
#
# Migration rule: when the desktop backend implements a type or field
# declared here, DELETE it from this file — the merge step fails on any
# overlap, forcing the removal. Root field args mirror what the frontend
# documents actually declare (variable nullability included).

scalar Long

