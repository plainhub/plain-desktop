"""
Bulk-operation outcome (plain-app contract): how many entities the
mutation actually affected.
"""
type ActionResult {
	affectedCount: Int!
}

type AndroidExtras {
	sdkVersion: Int!
	versionCodeName: String!
	securityPatch: String!
	bootloader: String!
	fingerprint: String!
	hardware: String!
	radioVersion: String!
	board: String!
	buildBrand: String!
	buildNumber: String!
	device: String!
	javaVmVersion: String!
	glEsVersion: String!
	buildTime: String!
}

type App {
	clientId: String!
	urlToken: String!
	httpPort: Int!
	httpsPort: Int!
	appDir: String!
	deviceName: String!
	deviceType: DeviceType!
	capabilities: [Capability!]!
