	createdAt: String!
	updatedAt: String!
}

type AudioFileInfo {
	"""
	Milliseconds. `0` in local mode (see `VideoFileInfo::duration_ms`).
	"""
	durationMs: Int!
	location: Location
}

"""
One track of the playback queue / a playlist (plain-app `AudioItem`).
Stored durations are seconds; the wire field is milliseconds.
"""
type AudioItem {
	title: String!
	artist: String!
	path: String!
	durationMs: Int!
}

"""
Recently played track (plain-app `AudioPlayHistory`).
"""
type AudioPlayHistory {
	path: String!
	title: String!
	artist: String!
	durationMs: Int!
	playCount: Int!
	playedAt: String!
}

"""
Audio player state (plain-app `AudioPlayback`). The desktop backend has
no playback engine — the queue is the shared state machine, the client
renders audio.
"""
type AudioPlayback {
	mode: MediaPlayMode!
	currentPath: String
	isPlaying: Boolean!
	positionMs: Int!
}

"""
A user playlist (plain-app `AudioPlaylist`); `itemCount` is live.
"""
type AudioPlaylist {
	id: String!
	name: String!
	itemCount: Int!
	createdAt: String!
	updatedAt: String!
}

type Bookmark {
	id: String!
