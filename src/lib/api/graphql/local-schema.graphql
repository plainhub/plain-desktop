	title: String!
	faviconPath: String!
	groupId: String!
	pinned: Boolean!
	clickCount: Int!
	lastClickedAt: String
	sortOrder: Int!
	createdAt: String!
	updatedAt: String!
}

type BookmarkGroup {
	id: String!
	name: String!
	collapsed: Boolean!
	sortOrder: Int!
	itemCount: Int!
	createdAt: String!
	updatedAt: String!
}

input BookmarkInput {
	url: String!
	title: String!
	groupId: String!
	pinned: Boolean!
	sortOrder: Int!
}

