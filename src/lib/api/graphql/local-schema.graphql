	MEDIA_TRASH
	MIRROR_AUDIO
	DOC_PREVIEW
	IMAGE_SEARCH
	MEDIA_SCAN
	SMS
	CALLS
	CALL_PHONE
	CONTACTS
	PACKAGES
	NOTES
	FEEDS
	SCREEN_MIRROR
	IMAGE_EDITOR
	NOTIFICATIONS
	CLIPBOARD
	POMODORO
	LAN_SHARE
	DISK_MANAGER
}

enum ChannelStatus {
	JOINED
	LEFT
	KICKED
}

type ChatChannel {
	id: String!
	name: String!
	ownerId: String!
	members: [ChatChannelMember!]!
