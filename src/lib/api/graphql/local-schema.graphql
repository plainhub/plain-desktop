"""
Taggable data domains, mirroring the plain-app `DataType` wire enum.
GraphQL-arg only — the local server has no tag tables yet; it exists so
enum-typed variables in `tags(type: $type)` documents validate.
"""
enum DataType {
	DEFAULT
	AUDIO
	VIDEO
	IMAGE
	SMS
	CONTACT
	NOTE
	FEED_ENTRY
	CALL
	PACKAGE
	FILE
	APP_FILE
	DOC
}

enum DbColumnType {
	TEXT
	INTEGER
	REAL
	BLOB
	NUMERIC
	UNKNOWN
}

type DbTableColumn {
	name: String!
	dataType: DbColumnType!
	notNull: Boolean!
	defaultValue: String
	primaryKey: Boolean!
}

type DbTableInfo {
	idKey: String!
}

type DeviceInfo {
	name: String!
	platform: DevicePlatform!
	manufacturer: String!
	model: String!
	osName: String!
	osVersion: String!
	kernelVersion: String!
	appVersion: String!
	appBuildNumber: String!
	language: String!
	cpuArch: String!
	cpuModel: String
	totalMemory: Int!
	totalStorage: Int!
	display: DisplayInfo
	android: AndroidExtras
}

enum DevicePlatform {
	ANDROID
	IOS
	MACOS
	WINDOWS
	LINUX
}

type DeviceStatus {
	uptimeSec: Int!
	"""
	0-100; None when the device has no battery or the level is unknown.
	"""
	batteryLevel: Int
	"""
	True only while actively charging; full-while-plugged is false.
	"""
	charging: Boolean!
	"""
	Empty when the platform exposes no temperature sources.
	"""
	temperatures: [Temperature!]!
	"""
	0-100 percent, diffed from two CPU counter samples.
	"""
	cpuUsage: Float!
	"""
	OS-level available memory; None when the platform does not expose it.
	"""
	memoryAvailable: Int
	"""
	Available bytes on the primary data volume.
	"""
	storageAvailable: Int!
}

enum DeviceType {
	PHONE
	TABLET
	COMPUTER
	TV
	NAS
	OTHER
	UNKNOWN
}

type DisplayInfo {
	width: Int!
	height: Int!
	density: Float!
}

enum DriveType {
	INTERNAL_STORAGE
	SDCARD
	USB_STORAGE
	APP
}

type FavoriteFolder {
	rootPath: String!
	fullPath: String!
